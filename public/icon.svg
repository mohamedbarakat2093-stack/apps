<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Glowing Signal Waves Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Core Speaker Driver Gradient -->
    <radialGradient id="coreDriver" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="85%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="pulseGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Card Base (Squircle) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.25"/>

  <!-- Transmission Rings (Concentric Broadcast Waves - بث موجات الصوت) -->
  <g filter="url(#softGlow)">
    <!-- Right Broadcast Arcs -->
    <path d="M 330 190 A 80 80 0 0 1 330 322" fill="none" stroke="url(#waveGrad)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 375 155 A 135 135 0 0 1 375 357" fill="none" stroke="url(#waveGrad)" stroke-width="8.5" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M 420 120 A 190 190 0 0 1 420 392" fill="none" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" stroke-opacity="0.6"/>

    <!-- Left Broadcast Arcs -->
    <path d="M 182 190 A 80 80 0 0 0 182 322" fill="none" stroke="url(#waveGrad)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 137 155 A 135 135 0 0 0 137 357" fill="none" stroke="url(#waveGrad)" stroke-width="8.5" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M 92 120 A 190 190 0 0 0 92 392" fill="none" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" stroke-opacity="0.6"/>
  </g>

  <!-- Broadcast Antenna Mast Top (أعلى البرج اللاسلكي) -->
  <line x1="256" y1="80" x2="256" y2="170" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
  <!-- Beacon Emitter Ball -->
  <circle cx="256" cy="74" r="14" fill="#34d399" filter="url(#pulseGlow)"/>
  <circle cx="256" cy="74" r="7" fill="#ffffff"/>

  <!-- Central Audio Transmitter Core (سماعة وباعث الصوت الفضائي) -->
  <g filter="url(#softGlow)">
    <!-- Outer Speaker Rim -->
    <circle cx="256" cy="256" r="62" fill="#0f172a" stroke="#38bdf8" stroke-width="5"/>
    <circle cx="256" cy="256" r="48" fill="url(#coreDriver)"/>
    <!-- Dome Cap -->
    <circle cx="256" cy="256" r="22" fill="#34d399" stroke="#ffffff" stroke-width="3"/>
    <circle cx="252" cy="252" r="6" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Frequency Equalizer Sound Spectrum Bars at Bottom (ترددات الصوت المتدفقة) -->
  <g transform="translate(146, 395)" filter="url(#softGlow)">
    <rect x="0" y="24" width="9" height="24" rx="4.5" fill="#38bdf8" opacity="0.9"/>
    <rect x="18" y="14" width="9" height="34" rx="4.5" fill="#38bdf8"/>
    <rect x="36" y="28" width="9" height="20" rx="4.5" fill="#38bdf8"/>
    <rect x="54" y="6" width="9" height="42" rx="4.5" fill="#0ea5e9"/>
    <rect x="72" y="18" width="9" height="30" rx="4.5" fill="#34d399"/>
    <rect x="90" y="0" width="9" height="48" rx="4.5" fill="#10b981"/>
    <rect x="108" y="12" width="9" height="36" rx="4.5" fill="#34d399"/>
    <rect x="126" y="22" width="9" height="26" rx="4.5" fill="#0ea5e9"/>
    <rect x="144" y="8" width="9" height="40" rx="4.5" fill="#38bdf8"/>
    <rect x="162" y="26" width="9" height="22" rx="4.5" fill="#38bdf8"/>
    <rect x="180" y="16" width="9" height="32" rx="4.5" fill="#38bdf8"/>
    <rect x="198" y="28" width="9" height="20" rx="4.5" fill="#38bdf8" opacity="0.9"/>
  </g>

  <!-- Clean Live Pulse Dot -->
  <circle cx="256" cy="468" r="4.5" fill="#10b981"/>
</svg>
